<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>콘솔창 계산기</title>
</head>
<body>
  <h1>콘솔창 계산기 프로그램</h1>
  <hr>

  <h3>Window OS의 경우</h3>
  <ol>
    <li>F12 키를 눌러 콘솔 창을 여세요.</li>
    <li>Console을 선택하고 <code>start()</code>를 입력해 계산기를 실행하세요.</li>
  </ol>

  <h3>Mac OS의 경우</h3>
  <ol>
    <li>Option + Command + I 키를 눌러 콘솔 창을 여세요.</li>
    <li>Console을 선택하고 <code>start()</code>를 입력해 계산기를 실행하세요.</li>
  </ol>

  <!-- JS 코드 -->
   <script src="app.js?v=2"></script>

   <!-- 문자열을 화면에 출력해라 -->
</body>
</html>
