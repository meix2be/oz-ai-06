<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>실시간 암호화폐 가격 변동 추적기</title>
  <link rel="stylesheet" href="crypto_style.css">
  <script src="crypto.js" defer></script>
</head>
<body>
  <main class="tracker">
    <header class="tracker-header">
      <p class="eyebrow">BINANCE 24H MARKET</p>
      <h1>실시간 암호화폐 가격 변동 추적기</h1>
      <p id="status" class="status">가격 정보를 불러오는 중입니다.</p>
    </header>

    <nav class="tabs" aria-label="암호화폐 목록 보기">
      <button class="tab active" data-view="all">전체보기</button>
      <button class="tab" data-view="favorites">관심항목</button>
    </nav>

    <label class="search-box" for="search-input">
      <span>🔎</span>
      <input id="search-input" type="search" placeholder="심볼 검색 (예: BTCUSDT)">
    </label>

    <section class="table-wrap" aria-live="polite">
      <table>
        <thead>
          <tr>
            <th>관심</th>
            <th>심볼</th>
            <th>현재가</th>
            <th>24시간 변동률</th>
            <th>최고가</th>
            <th>최저가</th>
          </tr>
        </thead>
        <tbody id="coin-list">
          <tr><td colspan="6" class="empty">데이터를 불러오는 중입니다.</td></tr>
        </tbody>
      </table>
    </section>

    <p class="update-note">Binance API에서 1초마다 데이터를 업데이트합니다.</p>
  </main>
</body>
</html>
